@if (total() > 0) {
  <nav
    class="grid grid-cols-3 items-center gap-3 p-4"
    aria-label="Paginación de la tabla"
  >
    <span class="justify-self-start text-sm font-normal text-gray-500 dark:text-gray-400">
      Mostrando
      <span class="font-semibold text-gray-900 dark:text-white">{{ from() }}–{{ to() }}</span>
      de
      <span class="font-semibold text-gray-900 dark:text-white">{{ total() }}</span>
    </span>

    @if (totalPages() > 1) {
      <ul class="col-start-2 inline-flex items-stretch justify-self-center -space-x-px">
        <li>
          <button
            type="button"
            (click)="go(page() - 1)"
            [disabled]="page() === 1"
            class="ml-0 flex h-full items-center justify-center rounded-l-lg border border-gray-300 bg-white px-3 py-1.5 text-gray-500 hover:bg-gray-100 hover:text-gray-700 disabled:cursor-not-allowed disabled:opacity-40 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white"
          >
            <span class="sr-only">Anterior</span>
            <svg class="h-4 w-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m15 19-7-7 7-7" />
            </svg>
          </button>
        </li>

        @for (slot of slots(); track $index) {
          @if (slot === 'ellipsis') {
            <li>
              <span class="flex items-center justify-center border border-gray-300 bg-white px-3 py-2 text-sm leading-tight text-gray-500 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400">…</span>
            </li>
          } @else {
            <li>
              <button
                type="button"
                (click)="go(slot)"
                [attr.aria-current]="slot === page() ? 'page' : null"
                [class]="slot === page()
                  ? 'z-10 flex items-center justify-center border border-primary-300 bg-primary-50 px-3 py-2 text-sm font-semibold leading-tight text-primary-600 hover:bg-primary-100 hover:text-primary-700 dark:border-gray-700 dark:bg-gray-700 dark:text-white'
                  : 'flex items-center justify-center border border-gray-300 bg-white px-3 py-2 text-sm leading-tight text-gray-500 hover:bg-gray-100 hover:text-gray-700 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white'"
              >
                {{ slot }}
              </button>
            </li>
          }
        }

        <li>
          <button
            type="button"
            (click)="go(page() + 1)"
            [disabled]="page() === totalPages()"
            class="flex h-full items-center justify-center rounded-r-lg border border-gray-300 bg-white px-3 py-1.5 text-gray-500 hover:bg-gray-100 hover:text-gray-700 disabled:cursor-not-allowed disabled:opacity-40 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white"
          >
            <span class="sr-only">Siguiente</span>
            <svg class="h-4 w-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m9 5 7 7-7 7" />
            </svg>
          </button>
        </li>
      </ul>
    }
  </nav>
}
