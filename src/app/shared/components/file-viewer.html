<!--
  Shared file viewer. Same overlay chassis as the app's other modals but a step
  above them (z-[60]) so it can sit over a detail modal (e.g. the payment history
  receipt). Renders a PDF in an iframe or an image in an <img>; the host feeds it
  the resolved signed URL through [state].
-->
@if (state(); as s) {
  <div class="fixed inset-0 z-[60] overflow-y-auto bg-gray-900/70" (click)="requestClose()">
    <div class="flex min-h-full items-center justify-center p-4">
      <div
        class="flex max-h-[92vh] w-full max-w-4xl flex-col overflow-hidden rounded-lg bg-white shadow-xl dark:bg-gray-800"
        (click)="$event.stopPropagation()"
      >
        <!-- Header -->
        <div class="flex items-center justify-between gap-4 border-b border-gray-200 px-5 py-3 dark:border-gray-700">
          <h2 class="truncate text-base font-semibold text-gray-900 dark:text-white">{{ s.title }}</h2>
          <button
            type="button"
            (click)="requestClose()"
            aria-label="Cerrar"
            class="rounded-lg p-1.5 text-gray-400 hover:bg-gray-100 hover:text-gray-700 dark:hover:bg-gray-700 dark:hover:text-gray-200"
          >
            <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <!-- Body -->
        <div class="flex min-h-[16rem] flex-1 items-center justify-center bg-gray-50 dark:bg-gray-900/40">
          @if (s.loading) {
            <p class="p-10 text-sm text-gray-400">Cargando…</p>
          } @else if (s.error) {
            <p class="p-10 text-center text-sm font-medium text-primary-700 dark:text-primary-300">{{ s.error }}</p>
          } @else if (s.url) {
            @if (isPdf()) {
              <iframe [src]="safeUrl()" [title]="s.title" class="h-[78vh] w-full"></iframe>
            } @else {
              <img [src]="s.url" [alt]="s.title" class="max-h-[78vh] w-auto object-contain" />
            }
          }
        </div>
      </div>
    </div>
  </div>
}
