<main class="min-h-screen bg-brand-gradient flex items-center justify-center p-4">
  <section class="w-full max-w-md rounded-2xl bg-white p-8 shadow-2xl dark:bg-gray-800">
    <img
      src="assets/logos/edv-logo-vertical-red.svg"
      alt="EDV Route"
      class="mx-auto w-44"
    />

    <h1 class="mt-6 text-center text-xl font-bold text-gray-900 dark:text-white">
      Panel de Administración
    </h1>
    <p class="mt-1 text-center text-sm text-gray-500 dark:text-gray-400">
      Acceso restringido al personal autorizado
    </p>

    <form class="mt-8 space-y-5" (ngSubmit)="onSubmit()">
      <div>
        <label
          for="username"
          class="mb-2 block text-sm font-semibold text-gray-900 dark:text-white"
        >
          Usuario
        </label>
        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          required
          [(ngModel)]="username"
          placeholder="usuario"
          class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 text-gray-900 focus:border-primary-700 focus:ring-primary-700 dark:border-gray-600 dark:bg-gray-700 dark:text-white"
        />
      </div>

      <div>
        <label
          for="password"
          class="mb-2 block text-sm font-semibold text-gray-900 dark:text-white"
        >
          Contraseña
        </label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          [(ngModel)]="password"
          placeholder="••••••••"
          class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 text-gray-900 focus:border-primary-700 focus:ring-primary-700 dark:border-gray-600 dark:bg-gray-700 dark:text-white"
        />
      </div>

      @if (error(); as message) {
        <p class="rounded-lg bg-primary-50 px-4 py-3 text-sm font-medium text-primary-700 dark:bg-gray-700 dark:text-primary-300">
          {{ message }}
        </p>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full rounded-lg bg-primary-700 px-5 py-3 text-sm font-semibold text-white hover:bg-primary-800 focus:outline-none focus:ring-4 focus:ring-primary-300 disabled:cursor-not-allowed disabled:opacity-60"
      >
        {{ loading() ? 'Verificando…' : 'Ingresar' }}
      </button>
    </form>
  </section>
</main>
