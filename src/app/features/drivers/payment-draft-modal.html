<div class="fixed inset-0 z-50 overflow-y-auto bg-gray-900/60">
  <div class="flex min-h-full items-center justify-center p-4">
    <div class="w-full max-w-3xl rounded-lg bg-white shadow-lg dark:bg-gray-800">
      <div class="border-b border-gray-100 px-4 pb-3 pt-4 dark:border-gray-700 sm:px-6 sm:pt-6">
        <h2 class="text-lg font-bold text-gray-900 dark:text-white">Datos del pago</h2>
        <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
          Registra cómo pagó el afiliado. La factura se emite al finalizar el registro.
        </p>
      </div>
      <!-- Two columns to keep the modal short: total · payment (same shell as the profile cobro modals) -->
      <div class="grid grid-cols-1 gap-x-6 gap-y-4 px-4 py-4 sm:grid-cols-5 sm:px-6">
        <div class="space-y-4 sm:col-span-2">
          @if (totalUsd(); as t) {
            <div class="flex items-center justify-between rounded-lg px-4 py-3" style="background-color: #fdfaec">
              <span class="text-sm font-bold text-gold-900">Total a pagar</span>
              <span class="text-2xl font-extrabold text-gold-900">${{ t }}</span>
            </div>
          }
        </div>
        <div class="sm:col-span-3">
          <app-payment-capture #pc [optional]="false" [captureAmount]="false" [value]="value()"
            (valueChange)="value.set($event)" (fileError)="error.set($event)" />
          @if (error(); as e) {
            <p class="mt-2 text-sm font-medium text-primary-700">{{ e }}</p>
          }
          @if (!pc.complete()) {
            <p class="mt-3 text-right text-xs text-gray-400">Completa los datos del pago para agregarlo.</p>
          }
        </div>
      </div>
      <div class="flex justify-end gap-3 border-t border-gray-100 px-4 py-4 dark:border-gray-700 sm:px-6">
        <button type="button" (click)="cancel.emit()"
          class="rounded-lg border border-gray-200 px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100 dark:border-gray-600 dark:text-gray-300 dark:hover:bg-gray-700">
          Cancelar
        </button>
        <button type="button" (click)="confirm()" [disabled]="!pc.complete()"
          class="rounded-lg bg-primary-700 px-4 py-2 text-sm font-semibold text-white hover:bg-primary-800 disabled:opacity-60">
          Agregar pago
        </button>
      </div>
    </div>
  </div>
</div>
