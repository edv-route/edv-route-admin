<!-- "Agregar documento" of an affiliate (extracted from the profile, 2026-11-13). -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900/60 p-4">
  <div class="w-full max-w-md rounded-lg bg-white p-4 shadow-lg dark:bg-gray-800 sm:p-6">
    <h2 class="text-lg font-bold text-gray-900 dark:text-white">Agregar documento</h2>
    <p class="mt-1 text-xs text-gray-400">
      Registra el documento contra un requerimiento; el archivo (PDF/JPG/PNG, máx. 10 MB)
      es opcional y puede adjuntarse después.
    </p>
    <form class="mt-5 space-y-4" (ngSubmit)="save()">
      <div>
        <label class="mb-2 block text-sm font-semibold text-gray-900 dark:text-white">Requerimiento</label>
        <app-select
          name="docRequirementId"
          [(ngModel)]="docRequirementId"
          [options]="options()"
          placeholder="Selecciona…"
          ariaLabel="Requerimiento" />
      </div>
      <div>
        <label class="mb-2 block text-sm font-semibold text-gray-900 dark:text-white">
          Archivo <span class="font-normal text-gray-400">(PDF, JPG o PNG · opcional)</span>
        </label>
        @if (docFileName) {
          <div class="flex items-center justify-between gap-2 rounded-lg border border-gray-200 bg-gray-50 px-3 py-2.5 text-sm dark:border-gray-600 dark:bg-gray-700">
            <span class="truncate text-gray-700 dark:text-gray-200">{{ docFileName }}</span>
            <button type="button" (click)="clearFile()" class="shrink-0 text-xs font-medium text-primary-700 hover:underline dark:text-primary-300">Cambiar</button>
          </div>
        } @else {
          <label class="flex cursor-pointer items-center justify-center gap-2 rounded-lg border-2 border-dashed border-gray-300 bg-gray-50 px-3 py-2.5 text-sm text-gray-500 hover:bg-gray-100 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-400 dark:hover:bg-gray-600">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" d="m18.375 12.739-7.693 7.693a4.5 4.5 0 0 1-6.364-6.364l10.94-10.94A3 3 0 1 1 19.5 7.372L8.552 18.32m.009-.01-.01.01m5.699-9.941-7.81 7.81a1.5 1.5 0 0 0 2.112 2.13" /></svg>
            Adjuntar archivo
            <input type="file" class="hidden" accept="application/pdf,image/jpeg,image/png" (change)="onFileSelected($event)" />
          </label>
        }
      </div>
      @if (error(); as message) {
        <p class="text-sm font-medium text-primary-700 dark:text-primary-300">{{ message }}</p>
      }
      <div class="flex justify-end gap-3">
        <button type="button" (click)="cancel.emit()"
          class="rounded-lg border border-gray-200 px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100 dark:border-gray-600 dark:text-gray-300 dark:hover:bg-gray-700">
          Cancelar
        </button>
        <button type="submit" [disabled]="!docRequirementId || saving()" [appBusy]="saving()"
          class="rounded-lg bg-primary-700 px-4 py-2 text-sm font-semibold text-white hover:bg-primary-800 disabled:opacity-60">
          {{ saving() ? 'Guardando…' : 'Registrar' }}
        </button>
      </div>
    </form>
  </div>
</div>
